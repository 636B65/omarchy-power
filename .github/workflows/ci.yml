name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shopt -s globstar nullglob
          scripts=(**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi
          echo "Checking ${#scripts[@]} shell script(s)..."
          bash -n "${scripts[@]}"
          shellcheck -x "${scripts[@]}"

      - name: Validate JSON files
        run: |
          shopt -s globstar nullglob
          json=(**/*.json)
          if [ ${#json[@]} -eq 0 ]; then
            echo "No JSON files found"
            exit 0
          fi
          echo "Validating ${#json[@]} JSON file(s)..."
          for f in "${json[@]}"; do
            echo -n "  $f ... "
            jq empty "$f"
            echo "OK"
          done

      - name: Check Python TUI
        run: |
          python3 -c "import ast; ast.parse(open('omarchy-power-config').read())"

      - name: Validate logind drop-ins
        run: |
          shopt -s nullglob
          for f in logind/*.conf; do
            echo -n "  $f ... "
            grep -qx '\[Login\]' "$f"
            if grep -vE '^(#.*|\[Login\]|[A-Za-z]+=[a-z-]+)?$' "$f"; then
              echo "unexpected line(s) above" >&2
              exit 1
            fi
            echo "OK"
          done
