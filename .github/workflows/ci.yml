name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck udev systemd

      - name: Lint shell scripts
        run: |
          shopt -s globstar nullglob
          scripts=(**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi
          echo "Checking ${#scripts[@]} shell script(s)..."
          bash -n "${scripts[@]}"
          shellcheck -x "${scripts[@]}"

      - name: Validate JSON files
        run: |
          shopt -s globstar nullglob
          json=(**/*.json)
          if [ ${#json[@]} -eq 0 ]; then
            echo "No JSON files found"
            exit 0
          fi
          echo "Validating ${#json[@]} JSON file(s)..."
          for f in "${json[@]}"; do
            echo -n "  $f ... "
            jq empty "$f"
            echo "OK"
          done

      - name: Validate systemd unit files
        run: |
          shopt -s globstar nullglob
          units=(**/*.service)
          if [ ${#units[@]} -eq 0 ]; then
            echo "No systemd unit files found"
            exit 0
          fi
          # systemd-analyze verify fails if an ExecStart target does not exist
          # on the runner. Create stub executables for every path referenced by
          # an ExecStart line so structure and syntax are validated while
          # machine-local install paths stay valid.
          while read -r exe; do
            exe=${exe#*=}
            if [[ $exe == /* ]]; then
              mkdir -p "$(dirname "$exe")"
              touch "$exe"
              chmod +x "$exe"
            fi
          done < <(grep -h -E '^\s*ExecStart=' "${units[@]}" | sed 's/^[[:space:]]*//')

          echo "Verifying ${#units[@]} systemd unit file(s)..."
          for f in "${units[@]}"; do
            echo -n "  $f ... "
            systemd-analyze verify "$f" 2>&1 && echo "OK" || exit 1
          done

      - name: Validate udev rules
        run: |
          shopt -s globstar nullglob
          rules=(**/*.rules)
          if [ ${#rules[@]} -eq 0 ]; then
            echo "No udev rules found"
            exit 0
          fi
          echo "Verifying ${#rules[@]} udev rule file(s)..."
          for f in "${rules[@]}"; do
            echo -n "  $f ... "
            udevadm verify "$f" && echo "OK" || exit 1
          done
