# omarchy-power: logind behavior per power source.
#
# This file is read by switch-power-behavior.sh. When installed, it lives at
# /etc/omarchy-power/power.conf (root-owned). The TUI (omarchy-power-config)
# edits a copy and applies it, so changes here while the TUI is open will be
# overwritten on the next Apply.
#
# Action values (any of logind's accepted values):
#   ignore poweroff reboot halt suspend hibernate hybrid-sleep
#   suspend-then-hibernate lock kexec
#
# idle_action_sec is in seconds and only takes effect when idle_action is
# something other than "ignore".

# Profile used while on AC adapter (plugged in).
AC_IDLE_ACTION=ignore
AC_IDLE_ACTION_SEC=0
AC_LID_SWITCH=ignore
AC_LID_SWITCH_EXTERNAL_POWER=ignore
AC_LID_SWITCH_DOCKED=ignore

# Profile used while on battery (unplugged).
BATTERY_IDLE_ACTION=suspend
BATTERY_IDLE_ACTION_SEC=1800
BATTERY_LID_SWITCH=suspend
BATTERY_LID_SWITCH_EXTERNAL_POWER=suspend
BATTERY_LID_SWITCH_DOCKED=ignore