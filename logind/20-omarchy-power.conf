# omarchy-power: lid-close behavior per power source.
#
# logind already picks the key by power source, so this file is static:
#   - more than one display or docked  -> HandleLidSwitchDocked
#   - on external power (AC)           -> HandleLidSwitchExternalPower
#   - otherwise (battery)              -> HandleLidSwitch
#
# Installed to /etc/systemd/logind.conf.d/20-omarchy-power.conf.
# Apply with: sudo systemctl reload systemd-logind
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
